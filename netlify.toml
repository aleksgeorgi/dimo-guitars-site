# The repo root is the Astro project, so no base directory is set.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro needs Node 22.23.4 or newer.
  NODE_VERSION = "24"

# Apex to www. www.dimoguitars.com is the primary domain.
[[redirects]]
  from = "https://dimoguitars.com/*"
  to = "https://www.dimoguitars.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://dimoguitars.com/*"
  to = "https://www.dimoguitars.com/:splat"
  status = 301
  force = true

# Built assets have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
