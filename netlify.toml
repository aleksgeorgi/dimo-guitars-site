# The repo root is the Astro project, so no base directory is set.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro needs Node 22.23.4 or newer.
  NODE_VERSION = "24"

# No apex/www redirect here: Netlify redirects to whichever domain is set as
# primary in Domain management, and a rule here would loop if the two disagree.

# Built assets have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
